<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="rsb-space" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#14224a"/><stop offset="1" stop-color="#05081a"/></radialGradient>
    <radialGradient id="rsb-planet" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#6fa8d8"/><stop offset=".6" stop-color="#2f5c92"/><stop offset="1" stop-color="#0f2040"/></radialGradient>
    <radialGradient id="rsb-atmo"><stop offset=".85" stop-color="#7fc4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7fc4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="rsb-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3246"/><stop offset="1" stop-color="#171c2b"/></linearGradient>
    <linearGradient id="rsb-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232a3c"/><stop offset="1" stop-color="#0e121e"/></linearGradient>
    <linearGradient id="rsb-console" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a455e"/><stop offset="1" stop-color="#1c2234"/></linearGradient>
    <linearGradient id="rsb-screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fb4ff"/><stop offset="1" stop-color="#2a6fb8"/></linearGradient>
    <linearGradient id="rsb-holo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6fd0ff" stop-opacity=".45"/><stop offset="1" stop-color="#6fd0ff" stop-opacity=".05"/></linearGradient>
    <radialGradient id="rsb-orange"><stop offset="0" stop-color="#ff9a3c" stop-opacity=".5"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
    <filter id="rsb-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="rsb-blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="rsb-win"><path d="M300 90H1300L1400 470H200Z"/></clipPath>
  </defs>

  <!-- Innenwand -->
  <rect width="1600" height="900" fill="url(#rsb-wall)"/>

  <!-- Sichtfenster: All, Sterne, Planet -->
  <g clip-path="url(#rsb-win)">
    <rect width="1600" height="900" fill="url(#rsb-space)"/>
    <g fill="#fff">
      <circle cx="380" cy="160" r="1.6" opacity=".8"/><circle cx="520" cy="240" r="1.2" opacity=".6"/><circle cx="640" cy="130" r="1.8" opacity=".8"/>
      <circle cx="760" cy="210" r="1.2" opacity=".6"/><circle cx="880" cy="140" r="1.5" opacity=".7"/><circle cx="1010" cy="260" r="1.2" opacity=".6"/>
      <circle cx="1130" cy="170" r="1.8" opacity=".8"/><circle cx="1240" cy="250" r="1.2" opacity=".6"/><circle cx="450" cy="340" r="1.2" opacity=".5"/>
      <circle cx="700" cy="330" r="1.4" opacity=".6"/><circle cx="960" cy="360" r="1.2" opacity=".5"/><circle cx="1180" cy="380" r="1.4" opacity=".6"/>
      <circle cx="300" cy="260" r="1.3" opacity=".6"/><circle cx="820" cy="110" r="1.2" opacity=".5"/>
    </g>
    <circle cx="1000" cy="560" r="330" fill="url(#rsb-atmo)"/>
    <circle cx="1000" cy="560" r="300" fill="url(#rsb-planet)"/>
    <g fill="#e8f2ff" opacity=".16"><ellipse cx="960" cy="440" rx="200" ry="14"/><ellipse cx="1040" cy="490" rx="230" ry="12"/><ellipse cx="980" cy="540" rx="260" ry="10"/></g>
    <circle cx="520" cy="300" r="46" fill="#c9a07a" opacity=".85"/><circle cx="508" cy="288" r="40" fill="#e0bf9a" opacity=".5"/>
    <ellipse cx="800" cy="500" rx="700" ry="60" fill="#ff9a3c" opacity=".08" filter="url(#rsb-blur)"/>
  </g>
  <!-- Fensterrahmen und Streben -->
  <path d="M300 90H1300L1400 470H200Z" fill="none" stroke="#10141f" stroke-width="22" stroke-linejoin="round"/>
  <path d="M300 90H1300L1400 470H200Z" fill="none" stroke="#4a5876" stroke-width="3" opacity=".7"/>
  <g stroke="#10141f" stroke-width="14"><path d="M600 90L560 470M1000 90L1040 470"/></g>
  <path d="M320 110H1280L1370 450" fill="none" stroke="#fff" stroke-width="2" opacity=".12"/>

  <!-- Wandpaneele mit Lichtstreifen -->
  <g>
    <rect x="0" y="0" width="150" height="560" fill="#1c2233"/><rect x="1450" y="0" width="150" height="560" fill="#1c2233"/>
    <g fill="#ff9a3c" opacity=".7"><rect x="40" y="120" width="8" height="260" rx="4"/><rect x="1552" y="120" width="8" height="260" rx="4"/></g>
    <g fill="#4fb4ff" opacity=".6"><rect x="80" y="160" width="6" height="180" rx="3"/><rect x="1514" y="160" width="6" height="180" rx="3"/></g>
    <circle cx="44" cy="250" r="90" fill="url(#rsb-orange)"/><circle cx="1556" cy="250" r="90" fill="url(#rsb-orange)"/>
    <rect x="150" y="470" width="1300" height="14" fill="#10141f"/>
  </g>

  <!-- Boden -->
  <path d="M0 560H1600V900H0Z" fill="url(#rsb-floor)"/>
  <g stroke="#3a455e" stroke-width="2" opacity=".5"><path d="M800 560V900M600 560L300 900M400 560L-100 900M1000 560L1300 900M1200 560L1700 900"/></g>
  <path d="M660 600H940L1020 720H580Z" fill="#4fb4ff" opacity=".08"/>

  <!-- Hologramm -->
  <g>
    <ellipse cx="800" cy="610" rx="120" ry="22" fill="none" stroke="#6fd0ff" stroke-width="3" opacity=".7"/>
    <ellipse cx="800" cy="610" rx="120" ry="22" fill="#6fd0ff" opacity=".15" filter="url(#rsb-blur2)"/>
    <path d="M690 610L720 480H880L910 610Z" fill="url(#rsb-holo)"/>
    <ellipse cx="800" cy="500" rx="60" ry="60" fill="none" stroke="#9fe4ff" stroke-width="2" opacity=".55"/>
    <ellipse cx="800" cy="500" rx="60" ry="18" fill="none" stroke="#9fe4ff" stroke-width="2" opacity=".5"/>
    <ellipse cx="800" cy="500" rx="22" ry="60" fill="none" stroke="#9fe4ff" stroke-width="2" opacity=".5"/>
    <circle cx="800" cy="500" r="80" fill="#6fd0ff" opacity=".1" filter="url(#rsb-blur)"/>
  </g>

  <!-- Konsole links -->
  <g>
    <path d="M60 640L420 600L560 700L560 790L60 830Z" fill="url(#rsb-console)"/>
    <path d="M60 640L420 600L560 700L140 700Z" fill="#4a5876" opacity=".6"/>
    <g fill="url(#rsb-screen)" opacity=".9"><path d="M170 690L350 668L420 700L220 718Z"/></g>
    <g fill="#ff9a3c"><rect x="250" y="735" width="26" height="8" rx="3"/><rect x="290" y="732" width="26" height="8" rx="3"/></g>
    <g fill="#9fe4ff"><rect x="340" y="727" width="26" height="8" rx="3"/><rect x="380" y="724" width="26" height="8" rx="3"/></g>
    <ellipse cx="300" cy="680" rx="200" ry="40" fill="#4fb4ff" opacity=".18" filter="url(#rsb-blur)"/>
  </g>
  <!-- Konsole rechts -->
  <g>
    <path d="M1540 640L1180 600L1040 700L1040 790L1540 830Z" fill="url(#rsb-console)"/>
    <path d="M1540 640L1180 600L1040 700L1460 700Z" fill="#4a5876" opacity=".6"/>
    <g fill="url(#rsb-screen)" opacity=".9"><path d="M1430 690L1250 668L1180 700L1380 718Z"/></g>
    <g fill="#ff9a3c"><rect x="1320" y="735" width="26" height="8" rx="3"/><rect x="1280" y="732" width="26" height="8" rx="3"/></g>
    <g fill="#9fe4ff"><rect x="1230" y="727" width="26" height="8" rx="3"/><rect x="1190" y="724" width="26" height="8" rx="3"/></g>
    <ellipse cx="1300" cy="680" rx="200" ry="40" fill="#4fb4ff" opacity=".18" filter="url(#rsb-blur)"/>
  </g>
  <!-- vordere Konsole mit Reihen von Leuchtflaechen -->
  <g>
    <path d="M520 790H1080L1130 900H470Z" fill="url(#rsb-console)"/>
    <g fill="#4fb4ff" opacity=".7"><rect x="560" y="815" width="80" height="14" rx="3"/><rect x="660" y="815" width="80" height="14" rx="3"/></g>
    <g fill="#ff9a3c" opacity=".7"><rect x="860" y="815" width="80" height="14" rx="3"/><rect x="960" y="815" width="60" height="14" rx="3"/></g>
  </g>

  <!-- Kommandosessel (Rueckenansicht, links der Mitte) -->
  <g>
    <ellipse cx="800" cy="745" rx="110" ry="14" fill="#05070d" opacity=".5"/>
    <rect x="788" y="700" width="24" height="46" fill="#10141f"/>
    <path d="M730 700Q730 580 800 570Q870 580 870 700Q800 720 730 700Z" fill="#2a3246"/>
    <path d="M750 690Q750 600 800 592Q850 600 850 690Q800 705 750 690Z" fill="#3a455e"/>
    <path d="M730 700Q730 580 800 570" fill="none" stroke="#4fb4ff" stroke-width="3" opacity=".6"/>
    <rect x="706" y="640" width="26" height="70" rx="8" fill="#232a3c"/><rect x="868" y="640" width="26" height="70" rx="8" fill="#232a3c"/>
  </g>

  <!-- Deckenlicht gedaempft -->
  <rect width="1600" height="900" fill="#05070d" opacity=".1"/>
  <ellipse cx="800" cy="30" rx="500" ry="60" fill="#4fb4ff" opacity=".12" filter="url(#rsb-blur)"/>
</svg>
