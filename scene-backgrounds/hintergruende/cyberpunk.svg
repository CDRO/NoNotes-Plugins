<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cyb-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a1a"/><stop offset="1" stop-color="#2a1440"/></linearGradient>
    <linearGradient id="cyb-bld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14122a"/><stop offset="1" stop-color="#0a0916"/></linearGradient>
    <linearGradient id="cyb-bld2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#201a3c"/><stop offset="1" stop-color="#120e24"/></linearGradient>
    <linearGradient id="cyb-wet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1730"/><stop offset="1" stop-color="#07060f"/></linearGradient>
    <radialGradient id="cyb-mag"><stop offset="0" stop-color="#ff3fb4" stop-opacity=".6"/><stop offset="1" stop-color="#ff3fb4" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyb-cya"><stop offset="0" stop-color="#2fe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#2fe0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="cyb-steam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b9a8e0" stop-opacity=".3"/><stop offset="1" stop-color="#b9a8e0" stop-opacity="0"/></linearGradient>
    <filter id="cyb-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="cyb-blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Nachthimmel -->
  <rect width="1600" height="900" fill="url(#cyb-sky)"/>
  <ellipse cx="800" cy="330" rx="420" ry="180" fill="#6a2a8a" opacity=".3" filter="url(#cyb-blur)"/>

  <!-- ferne Tuerme am Gassenende -->
  <g fill="#1b1636">
    <rect x="690" y="250" width="70" height="450"/><rect x="770" y="190" width="60" height="510"/><rect x="840" y="290" width="80" height="410"/>
  </g>
  <g fill="#2fe0ff" opacity=".35"><rect x="700" y="290" width="50" height="6"/><rect x="780" y="240" width="40" height="6"/><rect x="850" y="340" width="60" height="6"/></g>

  <!-- linke Haeuserwand (Perspektive zum Fluchtpunkt 800/470) -->
  <g>
    <path d="M0 0H610V610L0 790Z" fill="url(#cyb-bld)"/>
    <path d="M300 130L610 250V610L300 690Z" fill="url(#cyb-bld2)"/>
    <g stroke="#3a2d63" stroke-width="2" opacity=".7"><path d="M300 130V690M400 170V660M500 210V640M0 330L610 400M0 520L610 480"/></g>
    <g fill="#3a2d63" opacity=".6"><path d="M320 200L380 222V262L320 246Z"/><path d="M420 238L480 258V298L420 282Z"/><path d="M320 320L380 336V376L320 362Z"/><path d="M420 350L480 362V402L420 392Z"/><path d="M320 450L380 460V500L320 494Z"/></g>
    <g fill="#ffb86b" opacity=".5"><path d="M420 238L480 258V298L420 282Z"/><path d="M320 450L380 460V500L320 494Z"/></g>
  </g>
  <!-- rechte Haeuserwand -->
  <g>
    <path d="M1600 0H990V610L1600 790Z" fill="url(#cyb-bld)"/>
    <path d="M1300 110L990 240V610L1300 700Z" fill="url(#cyb-bld2)"/>
    <g stroke="#3a2d63" stroke-width="2" opacity=".7"><path d="M1300 110V700M1200 150V670M1100 190V640M1600 330L990 400M1600 520L990 480"/></g>
    <g fill="#3a2d63" opacity=".6"><path d="M1280 190L1220 212V252L1280 238Z"/><path d="M1180 228L1120 248V288L1180 272Z"/><path d="M1280 330L1220 346V386L1280 372Z"/><path d="M1180 360L1120 372V412L1180 402Z"/></g>
    <g fill="#2fe0ff" opacity=".45"><path d="M1180 228L1120 248V288L1180 272Z"/></g>
  </g>

  <!-- Neon-Formen (abstrakt) links, auf der Wand -->
  <g filter="url(#cyb-blur2)" opacity=".9">
    <rect x="130" y="260" width="14" height="170" rx="7" fill="#ff3fb4"/>
    <rect x="170" y="290" width="90" height="12" rx="6" fill="#2fe0ff"/>
    <rect x="170" y="330" width="60" height="12" rx="6" fill="#2fe0ff"/>
    <circle cx="210" cy="400" r="22" fill="none" stroke="#ff3fb4" stroke-width="8"/>
  </g>
  <g>
    <rect x="130" y="260" width="14" height="170" rx="7" fill="#ff7fd0"/>
    <rect x="170" y="290" width="90" height="12" rx="6" fill="#8ff0ff"/><rect x="170" y="330" width="60" height="12" rx="6" fill="#8ff0ff"/>
    <circle cx="210" cy="400" r="22" fill="none" stroke="#ff7fd0" stroke-width="6"/>
  </g>
  <circle cx="190" cy="350" r="170" fill="url(#cyb-mag)"/>
  <!-- Neon rechts -->
  <circle cx="1400" cy="380" r="180" fill="url(#cyb-cya)"/>
  <g filter="url(#cyb-blur2)"><rect x="1320" y="250" width="150" height="14" rx="7" fill="#2fe0ff"/><rect x="1320" y="290" width="90" height="14" rx="7" fill="#ff3fb4"/><rect x="1470" y="250" width="14" height="150" rx="7" fill="#2fe0ff"/></g>
  <g><rect x="1320" y="250" width="150" height="14" rx="7" fill="#8ff0ff"/><rect x="1320" y="290" width="90" height="14" rx="7" fill="#ff7fd0"/><rect x="1470" y="250" width="14" height="150" rx="7" fill="#8ff0ff"/>
  <circle cx="1380" cy="440" r="26" fill="none" stroke="#ff7fd0" stroke-width="7"/></g>

  <!-- Dampf -->
  <g filter="url(#cyb-blur)">
    <ellipse cx="620" cy="620" rx="90" ry="150" fill="url(#cyb-steam)"/>
    <ellipse cx="1010" cy="600" rx="80" ry="140" fill="url(#cyb-steam)"/>
    <ellipse cx="800" cy="650" rx="140" ry="60" fill="#b9a8e0" opacity=".12"/>
  </g>

  <!-- nasse Strasse -->
  <path d="M0 700H1600V900H0Z" fill="url(#cyb-wet)"/>
  <path d="M560 700H1040L1500 900H100Z" fill="#241c3e" opacity=".6"/>
  <!-- Reflexionen -->
  <g filter="url(#cyb-blur2)" opacity=".7">
    <rect x="150" y="730" width="40" height="150" fill="#ff3fb4" opacity=".5"/>
    <rect x="1330" y="730" width="150" height="150" fill="#2fe0ff" opacity=".4"/>
    <rect x="740" y="705" width="120" height="120" fill="#6a2a8a" opacity=".5"/>
  </g>
  <g stroke="#8ff0ff" stroke-width="2" opacity=".18"><path d="M400 760H700M900 790H1250M200 840H560M1050 850H1400"/></g>
  <g stroke="#ff7fd0" stroke-width="2" opacity=".18"><path d="M150 790H450M1000 740H1200M650 870H950"/></g>

  <!-- Regen (sparsam, schraeg) -->
  <g stroke="#9ab8e8" stroke-width="1.5" opacity=".18">
    <path d="M100 0L80 40M300 200L280 240M520 80L500 120M700 400L680 440M1000 60L980 100M1200 500L1180 540M1450 150L1430 190M1500 600L1480 640M900 600L880 640M200 600L180 640"/>
  </g>
  <rect width="1600" height="900" fill="#05030c" opacity=".12"/>
</svg>
