  <!-- Oberflaechenschimmer -->
  <path d="M0 0H1600V30C1400 50 1200 20 1000 40C800 55 600 20 400 40C200 55 100 30 0 40Z" fill="#d8f6f0" opacity=".25" filter="url(#unw-blur2)"/>
</svg>
