    <path d="M300 795C300 740 360 740 360 795Z" fill="#c26a8c"/>
    <path d="M320 795C320 760 380 760 380 795Z" fill="#a8557a"/>
    <path d="M400 795C400 700 380 650 410 610C440 650 430 700 450 795Z" fill="#e0a05a"/>
