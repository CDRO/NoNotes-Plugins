<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="unw-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e9bb0"/><stop offset=".5" stop-color="#1f6d8c"/><stop offset="1" stop-color="#0f3d5e"/></linearGradient>
    <linearGradient id="unw-ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8f6f0" stop-opacity=".35"/><stop offset="1" stop-color="#d8f6f0" stop-opacity="0"/></linearGradient>
    <linearGradient id="unw-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a97c"/><stop offset="1" stop-color="#7d7255"/></linearGradient>
    <linearGradient id="unw-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b5a78" stop-opacity="0"/><stop offset="1" stop-color="#17506b" stop-opacity=".9"/></linearGradient>
    <radialGradient id="unw-surf" cx=".5" cy="0" r=".7"><stop offset="0" stop-color="#bff0e6" stop-opacity=".5"/><stop offset="1" stop-color="#bff0e6" stop-opacity="0"/></radialGradient>
    <filter id="unw-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="unw-blur2"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="unw-fishS" d="M0 0Q14 -8 28 0Q14 8 0 0ZM26 0L38 -7V7Z"/>
    <path id="unw-fishL" d="M0 0Q22 -13 44 0Q22 13 0 0ZM42 0L60 -11V11Z"/>
  </defs>

  <!-- Wasser -->
  <rect width="1600" height="900" fill="url(#unw-water)"/>
  <rect width="1600" height="500" fill="url(#unw-surf)"/>

  <!-- Lichtstrahlen -->
  <g filter="url(#unw-blur)" fill="url(#unw-ray)">
    <path d="M200 0H330L120 760H-60Z"/>
    <path d="M560 0H660L560 800H380Z"/>
    <path d="M900 0H1030L980 800H760Z"/>
    <path d="M1250 0H1340L1420 780H1190Z"/>
    <path d="M1500 0H1600V700H1450Z"/>
  </g>

  <!-- ferne Felsen -->
  <g fill="#17506b" opacity=".8">
    <path d="M0 700C100 600 180 560 280 640C380 520 480 560 560 700Z"/>
    <path d="M1000 710C1080 600 1180 540 1280 620C1360 560 1480 600 1600 680V720H1000Z"/>
  </g>
  <rect y="500" width="1600" height="300" fill="url(#unw-far)"/>

  <!-- ferner Fischschwarm -->
  <g fill="#8fd0d6" opacity=".35">
        <use href="#unw-fishS" x="1120" y="250"/><use href="#unw-fishS" x="1160" y="272"/><use href="#unw-fishS" x="1100" y="290"/><use href="#unw-fishS" x="1210" y="240"/><use href="#unw-fishS" x="1190" y="305"/><use href="#unw-fishS" x="1250" y="275"/>
    <use href="#unw-fishS" x="1060" y="320"/><use href="#unw-fishS" x="1140" y="335"/>
  </g>

  <!-- Sandboden -->
  <path d="M0 780C200 740 400 790 640 770C880 750 1100 800 1340 765C1480 745 1560 770 1600 760V900H0Z" fill="url(#unw-sand)"/>
  <path d="M0 840C260 815 520 850 800 835C1100 818 1360 850 1600 830V900H0Z" fill="#6b6249" opacity=".5"/>
  <g fill="#cdbe90" opacity=".5"><ellipse cx="300" cy="800" rx="60" ry="5"/><ellipse cx="1000" cy="810" rx="80" ry="5"/><ellipse cx="1400" cy="790" rx="50" ry="4"/></g>

  <!-- Algen links -->
  <g fill="#2f8a64" opacity=".95">
