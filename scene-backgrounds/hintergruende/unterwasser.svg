    <path d="M1330 795C1330 755 1400 755 1400 795Z" fill="#cf7a58"/>
    <path d="M1440 800C1420 720 1470 680 1450 600C1500 680 1480 740 1500 800Z" fill="#2f8a64"/>
    <path d="M1500 800C1490 740 1540 700 1520 640C1570 700 1550 750 1560 800Z" fill="#3aa073"/>
    <path d="M1560 800C1550 760 1590 740 1580 700C1610 740 1600 770 1600 800Z" fill="#256f52"/>
  </g>

  <!-- Fischschwarm vorne (aussermittig, ruhig) -->
  <g fill="#f0c36a" opacity=".85">
        <use href="#unw-fishL" x="140" y="300"/><use href="#unw-fishL" x="210" y="340"/><use href="#unw-fishL" x="100" y="380"/><use href="#unw-fishL" x="260" y="290"/>
  </g>
  <g fill="#e87f6a" opacity=".8">
    <use href="#unw-fishL" x="1330" y="470" transform="translate(2660 0) scale(-1 1)"/>
    <use href="#unw-fishL" x="1270" y="520" transform="translate(2540 0) scale(-1 1)"/>
    <use href="#unw-fishL" x="1390" y="540" transform="translate(2780 0) scale(-1 1)"/>
  </g>

  <!-- Blasen -->
  <g fill="none" stroke="#d8f6f0" stroke-width="2" opacity=".5">
    <circle cx="430" cy="560" r="8"/><circle cx="445" cy="500" r="5"/><circle cx="425" cy="440" r="11"/><circle cx="450" cy="360" r="6"/>
    <circle cx="1210" cy="620" r="7"/><circle cx="1195" cy="560" r="10"/><circle cx="1220" cy="490" r="5"/>
    <circle cx="80" cy="500" r="6"/><circle cx="1520" cy="400" r="8"/>
