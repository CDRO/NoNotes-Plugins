<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bue-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5d9de"/><stop offset="1" stop-color="#b9bfc8"/></linearGradient>
    <linearGradient id="bue-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f8c88"/><stop offset="1" stop-color="#6a6865"/></linearGradient>
    <linearGradient id="bue-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd9ee"/><stop offset="1" stop-color="#e5eef2"/></linearGradient>
    <linearGradient id="bue-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b08a62"/><stop offset="1" stop-color="#8a6a4a"/></linearGradient>
    <linearGradient id="bue-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6d8" stop-opacity=".45"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></linearGradient>
    <linearGradient id="bue-shelf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a7f88"/><stop offset="1" stop-color="#666b74"/></linearGradient>
    <filter id="bue-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Wand und Boden -->
  <rect width="1600" height="900" fill="url(#bue-wall)"/>
  <rect y="690" width="1600" height="210" fill="url(#bue-floor)"/>
  <rect y="680" width="1600" height="14" fill="#a5a8ae"/>

  <!-- Grosses Fenster mit Tageslicht -->
  <g>
    <rect x="360" y="110" width="760" height="470" fill="#8d949e"/>
    <rect x="378" y="128" width="724" height="434" fill="url(#bue-sky)"/>
    <!-- ferne Skyline -->
    <g fill="#a5bccd" opacity=".8"><rect x="400" y="400" width="60" height="162"/><rect x="470" y="340" width="80" height="222"/><rect x="560" y="420" width="70" height="142"/><rect x="760" y="370" width="90" height="192"/><rect x="870" y="430" width="60" height="132"/><rect x="940" y="330" width="80" height="232"/><rect x="1030" y="410" width="60" height="152"/></g>
    <g fill="#fff" opacity=".7"><ellipse cx="560" cy="210" rx="90" ry="22"/><ellipse cx="900" cy="260" rx="110" ry="24"/></g>
    <path d="M740 128V562M378 345H1102" stroke="#8d949e" stroke-width="14"/>
    <rect x="340" y="580" width="800" height="22" fill="#a9afb8"/>
  </g>
  <!-- Lichteinfall auf Boden und Wand -->
  <path d="M378 562H1102L1400 900H620Z" fill="url(#bue-light)" opacity=".55" filter="url(#bue-blur)"/>

  <!-- Regal mit Ordnern rechts -->
  <g>
    <rect x="1230" y="170" width="300" height="520" fill="url(#bue-shelf)"/>
    <g fill="#4f545d"><rect x="1244" y="184" width="272" height="148"/><rect x="1244" y="344" width="272" height="148"/><rect x="1244" y="504" width="272" height="170"/></g>
    <g>
      <rect x="1256" y="230" width="22" height="102" fill="#4f7aa5"/><rect x="1280" y="244" width="22" height="88" fill="#c9a24e"/><rect x="1304" y="226" width="22" height="106" fill="#b95d58"/><rect x="1328" y="240" width="22" height="92" fill="#e2e4e8"/><rect x="1352" y="230" width="22" height="102" fill="#4f7aa5"/><rect x="1376" y="250" width="22" height="82" fill="#6f9a7d"/>
      <rect x="1410" y="266" width="90" height="66" fill="#c9a24e" opacity=".9"/>
      <rect x="1256" y="400" width="22" height="92" fill="#6f9a7d"/><rect x="1280" y="388" width="22" height="104" fill="#4f7aa5"/><rect x="1304" y="404" width="22" height="88" fill="#e2e4e8"/><rect x="1328" y="392" width="22" height="100" fill="#b95d58"/><rect x="1352" y="408" width="22" height="84" fill="#c9a24e"/>
      <rect x="1420" y="440" width="76" height="52" fill="#e2e4e8"/><rect x="1424" y="426" width="68" height="14" fill="#c9a24e"/>
      <rect x="1256" y="560" width="22" height="114" fill="#b95d58"/><rect x="1280" y="548" width="22" height="126" fill="#4f7aa5"/><rect x="1304" y="566" width="22" height="108" fill="#e2e4e8"/><rect x="1328" y="552" width="22" height="122" fill="#6f9a7d"/><rect x="1352" y="560" width="22" height="114" fill="#c9a24e"/><rect x="1376" y="570" width="22" height="104" fill="#b95d58"/>
    </g>
    <rect x="1230" y="680" width="300" height="12" fill="#5a5f68"/>
  </g>

  <!-- Pflanze links -->
  <g>
    <path d="M215 700H275L268 770H222Z" fill="#8e7a6a" transform="translate(-20 0)"/>
    <ellipse cx="225" cy="705" rx="30" ry="6" fill="#6e5c50"/>
    <g fill="#5f8d62"><path d="M225 700Q150 640 140 540Q200 590 225 700Z"/><path d="M225 700Q250 590 220 480Q290 560 225 700Z"/><path d="M225 700Q300 650 330 560Q280 560 225 700Z"/><path d="M225 700Q120 690 90 640Q160 640 225 700Z" fill="#74a374"/><path d="M225 700Q330 700 350 650Q280 640 225 700Z" fill="#74a374"/></g>
  </g>

  <!-- Schreibtisch -->
  <g>
    <ellipse cx="780" cy="850" rx="560" ry="26" fill="#000" opacity=".12" filter="url(#bue-blur)"/>
    <rect x="360" y="650" width="880" height="26" rx="4" fill="url(#bue-desk)"/>
    <rect x="360" y="676" width="880" height="10" fill="#6c523a"/>
    <rect x="390" y="686" width="22" height="170" fill="#4b4e56"/><rect x="1190" y="686" width="22" height="170" fill="#4b4e56"/>
    <rect x="1050" y="686" width="140" height="150" fill="#6c7078"/><rect x="1060" y="700" width="120" height="44" fill="#7d818a"/><rect x="1060" y="756" width="120" height="44" fill="#7d818a"/>
    <!-- Monitor -->
    <path d="M740 650H830L822 620H748Z" fill="#3e4148"/>
    <rect x="600" y="440" width="370" height="190" rx="8" fill="#2f3239"/>
    <rect x="612" y="452" width="346" height="166" fill="#5d7ea3"/>
    <rect x="612" y="452" width="346" height="166" fill="url(#bue-light)"/>
    <g fill="#e7eef5" opacity=".55"><rect x="632" y="472" width="130" height="10"/><rect x="632" y="494" width="200" height="8"/><rect x="632" y="512" width="170" height="8"/><rect x="632" y="530" width="220" height="8"/></g>
    <!-- Tastatur, Maus, Tasse, Papiere -->
    <rect x="640" y="632" width="190" height="16" rx="3" fill="#cfd3d9"/>
    <ellipse cx="880" cy="642" rx="16" ry="8" fill="#cfd3d9"/>
    <rect x="1000" y="610" width="34" height="40" rx="4" fill="#c06a54"/><path d="M1034 622Q1050 626 1034 640" fill="none" stroke="#c06a54" stroke-width="5"/>
    <rect x="420" y="634" width="110" height="14" fill="#f0f0f0"/><rect x="430" y="624" width="110" height="12" fill="#e2e4e8"/>
    <!-- Lampe -->
    <path d="M470 650V560L520 530" stroke="#3e4148" stroke-width="7" fill="none"/><path d="M505 525L545 520L530 545Z" fill="#3e4148"/>
  </g>

  <!-- Buerostuhl -->
  <g>
    <rect x="770" y="780" width="12" height="70" fill="#35383f"/>
    <path d="M720 855L776 845L832 855" stroke="#35383f" stroke-width="9" fill="none"/>
    <path d="M700 770Q776 790 850 770L840 745Q776 760 710 745Z" fill="#454952"/>
    <path d="M730 740Q725 640 750 600Q776 590 802 600Q827 640 822 740Z" fill="#454952"/>
  </g>
</svg>
