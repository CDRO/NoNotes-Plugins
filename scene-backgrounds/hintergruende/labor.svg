<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lab-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c3a35"/><stop offset="1" stop-color="#58493a"/></linearGradient>
    <linearGradient id="lab-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2d22"/><stop offset="1" stop-color="#201710"/></linearGradient>
    <linearGradient id="lab-bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6240"/><stop offset="1" stop-color="#5e4128"/></linearGradient>
    <radialGradient id="lab-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffbe5a" stop-opacity=".6"/><stop offset="1" stop-color="#ffbe5a" stop-opacity="0"/></radialGradient>
    <radialGradient id="lab-vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#140d08" stop-opacity="0"/><stop offset="1" stop-color="#140d08" stop-opacity=".5"/></radialGradient>
    <linearGradient id="lab-liqG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ed08a"/><stop offset="1" stop-color="#3a9a62"/></linearGradient>
    <linearGradient id="lab-liqR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e07a6a"/><stop offset="1" stop-color="#b24a4a"/></linearGradient>
    <linearGradient id="lab-liqB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ab4e0"/><stop offset="1" stop-color="#3a7ab8"/></linearGradient>
    <filter id="lab-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <!-- Zahnrad-Vorlage -->
    <g id="lab-gear">
      <circle r="40" fill="#b07a3a"/>
      <g fill="#b07a3a"><rect x="-8" y="-54" width="16" height="16" rx="2"/><rect x="-8" y="38" width="16" height="16" rx="2"/><rect x="-54" y="-8" width="16" height="16" rx="2"/><rect x="38" y="-8" width="16" height="16" rx="2"/>
        <rect x="-8" y="-54" width="16" height="16" rx="2" transform="rotate(45)"/><rect x="-8" y="38" width="16" height="16" rx="2" transform="rotate(45)"/><rect x="-54" y="-8" width="16" height="16" rx="2" transform="rotate(45)"/><rect x="38" y="-8" width="16" height="16" rx="2" transform="rotate(45)"/></g>
      <circle r="24" fill="#3c3a35" opacity=".55"/><circle r="10" fill="#8a5a28"/>
    </g>
  </defs>

  <!-- Wand: Ziegel/Bretter und Boden -->
  <rect width="1600" height="900" fill="url(#lab-wall)"/>
  <g stroke="#2a2018" stroke-width="2" opacity=".4"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600"/></g>
  <rect y="690" width="1600" height="210" fill="url(#lab-floor)"/>
  <g stroke="#150e08" stroke-width="2" opacity=".5"><path d="M0 760H1600M0 830H1600"/></g>

  <!-- Rohre an der Decke -->
  <g fill="none" stroke="#6a5a48" stroke-width="16" stroke-linecap="round">
    <path d="M0 50H700Q740 50 740 90V140"/><path d="M900 40H1600"/>
  </g>
  <g fill="#8a7458"><rect x="300" y="38" width="12" height="24"/><rect x="560" y="38" width="12" height="24"/><rect x="1200" y="28" width="12" height="24"/></g>

  <!-- Zahnraeder gross, ruhig im Hintergrund -->
  <g opacity=".5">
    <use href="#lab-gear" transform="translate(90 610) scale(1.3)"/>
    <use href="#lab-gear" transform="translate(1480 120) scale(1.4)"/>
    <use href="#lab-gear" transform="translate(1550 400) scale(.8)"/>
  </g>

  <!-- Werkzeugwand links -->
  <g transform="translate(0 -100)">
    <rect x="40" y="330" width="360" height="200" rx="6" fill="#4a3a2a" opacity=".7"/>
    <g stroke="#b8b0a0" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M80 360V490"/><path d="M130 360V470"/>
    </g>
    <circle cx="80" cy="352" r="14" fill="none" stroke="#b8b0a0" stroke-width="8"/>
    <path d="M115 350H145V370H115Z" fill="#b8b0a0"/>
    <g fill="#7a5a38"><rect x="180" y="400" width="14" height="110" rx="4"/><rect x="215" y="400" width="14" height="110" rx="4"/></g>
    <g fill="#b8b0a0"><rect x="172" y="360" width="30" height="40" rx="3"/><path d="M212 360H236L224 400Z"/></g>
    <path d="M270 365Q320 340 360 380" stroke="#b8b0a0" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="280" y="400" width="12" height="100" fill="#b8b0a0"/>
    <path d="M310 380H380V396H340V500H322V396H310Z" fill="#9a9488"/>
  </g>

  <!-- Regal mit Flaschen (oben Mitte-rechts) -->
  <g>
    <rect x="1040" y="250" width="440" height="12" fill="#2a1d12"/>
    <rect x="1040" y="400" width="440" height="12" fill="#2a1d12"/>
    <g>
      <rect x="1070" y="198" width="36" height="52" rx="10" fill="url(#lab-liqB)" opacity=".85"/><rect x="1080" y="184" width="16" height="16" fill="#8a6a48"/>
      <rect x="1120" y="210" width="30" height="40" rx="8" fill="url(#lab-liqG)" opacity=".85"/>
      <circle cx="1220" cy="222" r="26" fill="url(#lab-liqR)" opacity=".85"/><rect x="1212" y="186" width="16" height="14" fill="#8a6a48"/>
      <rect x="1290" y="190" width="40" height="60" rx="6" fill="#a89878" opacity=".8"/>
      <rect x="1350" y="205" width="34" height="45" rx="6" fill="#8a6a48"/>
      <rect x="1410" y="196" width="40" height="54" rx="10" fill="url(#lab-liqG)" opacity=".85"/>
    </g>
    <g>
      <rect x="1070" y="350" width="60" height="50" rx="6" fill="#6a5a48"/><rect x="1140" y="340" width="60" height="60" rx="6" fill="#7a6650"/>
      <circle cx="1270" cy="370" r="30" fill="#c9a050"/><circle cx="1270" cy="370" r="22" fill="#8a6a28"/>
      <rect x="1330" y="338" width="30" height="62" rx="8" fill="url(#lab-liqB)" opacity=".85"/>
      <rect x="1380" y="350" width="30" height="50" rx="8" fill="url(#lab-liqR)" opacity=".85"/>
      <rect x="1420" y="358" width="40" height="42" rx="6" fill="#6a5a48"/>
    </g>
  </g>

  <!-- Tafel / Plan an der Wand (nur Striche) -->
  <g>
    <rect x="520" y="160" width="300" height="200" rx="4" fill="#d6c7a0" opacity=".75"/>
    <g stroke="#5a4a38" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round">
      <circle cx="610" cy="260" r="42"/><circle cx="610" cy="260" r="14"/><path d="M652 260H760M560 200H600M700 190H780M700 320H780M560 320H590"/>
    </g>
  </g>

  <!-- Hängelampe mit Lichtkegel -->
  <g>
    <path d="M820 0V120" stroke="#2a1d12" stroke-width="4"/>
    <path d="M770 160Q820 90 870 160Z" fill="#b07a3a"/>
    <ellipse cx="820" cy="170" rx="260" ry="200" fill="url(#lab-glow)"/>
    <ellipse cx="820" cy="165" rx="30" ry="8" fill="#ffd98a"/>
  </g>

  <!-- Werkbank -->
  <g>
    <rect x="200" y="590" width="1240" height="40" rx="6" fill="url(#lab-bench)"/>
    <rect x="200" y="590" width="1240" height="8" fill="#c8924f" opacity=".5"/>
    <rect x="230" y="630" width="40" height="270" fill="#4a3220"/><rect x="1370" y="630" width="40" height="270" fill="#4a3220"/>
    <rect x="270" y="700" width="1100" height="20" fill="#3a2718"/>
    <rect x="300" y="740" width="280" height="130" rx="6" fill="#5a3f28"/><circle cx="440" cy="805" r="8" fill="#b07a3a"/>
  </g>

  <!-- Reagenzglasstaender -->
  <g>
    <rect x="260" y="560" width="190" height="14" rx="4" fill="#6a4a2c"/>
    <rect x="270" y="574" width="170" height="16" fill="#5a3e24"/>
    <g opacity=".9">
      <rect x="275" y="490" width="22" height="75" rx="10" fill="url(#lab-liqG)"/>
      <rect x="310" y="480" width="22" height="85" rx="10" fill="url(#lab-liqR)"/>
      <rect x="345" y="495" width="22" height="70" rx="10" fill="url(#lab-liqB)"/>
      <rect x="380" y="485" width="22" height="80" rx="10" fill="#e0c060"/>
      <rect x="415" y="498" width="22" height="67" rx="10" fill="url(#lab-liqG)"/>
    </g>
    <g fill="#fff" opacity=".18"><rect x="279" y="495" width="5" height="60" rx="2"/><rect x="314" y="485" width="5" height="70" rx="2"/><rect x="349" y="500" width="5" height="55" rx="2"/></g>
  </g>

  <!-- Kolben -->
  <g>
    <path d="M520 590V540L490 590Z" fill="none"/>
    <path d="M540 590H650L610 500V450H580V500Z" fill="#cfe6e4" opacity=".28" stroke="#cfe6e4" stroke-opacity=".5" stroke-width="3"/>
    <path d="M552 590H638L616 540H574Z" fill="url(#lab-liqG)"/>
    <rect x="574" y="440" width="36" height="12" rx="3" fill="#8a6a48"/>
    <circle cx="840" cy="540" r="48" fill="#cfe6e4" opacity=".25" stroke="#cfe6e4" stroke-opacity=".5" stroke-width="3"/>
    <path d="M794 545A48 48 0 0 0 886 545Z" fill="url(#lab-liqR)"/>
    <rect x="828" y="470" width="24" height="26" fill="#cfe6e4" opacity=".4"/><rect x="824" y="462" width="32" height="10" rx="3" fill="#8a6a48"/>
    <path d="M700 590H770L750 520H720Z" fill="#cfe6e4" opacity=".25" stroke="#cfe6e4" stroke-opacity=".5" stroke-width="3"/>
    <path d="M708 590H762L752 550H718Z" fill="url(#lab-liqB)"/>
    <!-- Schlauch -->
    <path d="M590 450Q640 400 700 440T730 520" fill="none" stroke="#b07a3a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Mikroskop -->
  <g fill="#b07a3a">
    <rect x="1040" y="572" width="120" height="18" rx="4" fill="#6a4a2c"/>
    <path d="M1100 575V480Q1100 440 1140 430" fill="none" stroke="#b07a3a" stroke-width="20" stroke-linecap="round"/>
    <rect x="1090" y="410" width="30" height="80" rx="6" transform="rotate(25 1105 450)" fill="#8a5a28"/>
    <rect x="1070" y="545" width="80" height="10" rx="3" fill="#8a5a28"/>
    <circle cx="1155" cy="428" r="9" fill="#3c3a35"/>
  </g>

  <!-- Zahnraeder auf der Werkbank -->
  <g>
    <use href="#lab-gear" transform="translate(1250 555) scale(.55)"/>
    <use href="#lab-gear" transform="translate(1310 570) scale(.35)"/>
    <rect x="1190" y="575" width="30" height="15" fill="#8a8478"/>
    <path d="M1340 590L1400 560" stroke="#b8b0a0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Lichtstimmung -->
  <ellipse cx="820" cy="500" rx="600" ry="300" fill="#ffb04a" opacity=".1" filter="url(#lab-blur)"/>
  <rect width="1600" height="900" fill="url(#lab-vig)"/>
</svg>
