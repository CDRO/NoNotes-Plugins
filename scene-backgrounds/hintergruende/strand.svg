  <g stroke="#5a3a5e" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M330 690Q326 660 316 644M338 690Q342 656 356 640M346 692Q356 668 372 662"/>
    <path d="M1240 700Q1236 666 1226 650M1248 700Q1252 664 1266 648M1256 702Q1266 676 1282 670"/>
  </g>

  <!-- Palme links -->
  <g>
    <path d="M150 800Q190 640 170 470Q166 420 180 372" fill="none" stroke="#2c1f45" stroke-width="16" stroke-linecap="round"/>
    <g fill="#2c1f45">
      <path d="M180 372Q110 340 40 380Q110 350 180 372Z"/>
      <path d="M180 372Q130 300 60 300Q130 310 180 372Z"/>
      <path d="M180 372Q190 290 250 250Q214 300 180 372Z"/>
      <path d="M180 372Q250 320 330 340Q250 340 180 372Z"/>
      <path d="M180 372Q250 380 300 430Q240 400 180 372Z"/>
      <path d="M180 372Q120 390 90 450Q130 410 180 372Z"/>
    </g>
  </g>
  <!-- Palme rechts -->
  <g>
    <path d="M1470 790Q1430 660 1450 540Q1456 500 1440 452" fill="none" stroke="#2c1f45" stroke-width="14" stroke-linecap="round"/>
    <g fill="#2c1f45">
      <path d="M1440 452Q1510 420 1580 456Q1510 430 1440 452Z"/>
      <path d="M1440 452Q1490 390 1560 392Q1490 400 1440 452Z"/>
      <path d="M1440 452Q1430 380 1370 346Q1404 390 1440 452Z"/>
      <path d="M1440 452Q1370 410 1296 430Q1370 430 1440 452Z"/>
      <path d="M1440 452Q1380 466 1344 520Q1396 490 1440 452Z"/>
      <path d="M1440 452Q1500 466 1530 520Q1490 490 1440 452Z"/>
    </g>
  </g>

  <!-- Ferne Vögel -->
  <g fill="none" stroke="#4a2f5e" stroke-width="2.5" stroke-linecap="round" opacity=".6">
    <path d="M1020 300Q1030 292 1040 300Q1050 292 1060 300"/><path d="M1080 340Q1088 334 1096 340Q1104 334 1112 340"/>
  </g>
</svg>
