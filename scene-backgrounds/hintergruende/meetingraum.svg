<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mtg-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edef"/><stop offset="1" stop-color="#d3dadd"/></linearGradient>
    <linearGradient id="mtg-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aeb7bb"/><stop offset="1" stop-color="#8a959a"/></linearGradient>
    <linearGradient id="mtg-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd6e0"/><stop offset="1" stop-color="#e6eef0"/></linearGradient>
    <linearGradient id="mtg-table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f4"/><stop offset="1" stop-color="#cfd5d8"/></linearGradient>
    <linearGradient id="mtg-tableside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa5aa"/><stop offset="1" stop-color="#6d7a80"/></linearGradient>
    <linearGradient id="mtg-screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27474f"/><stop offset="1" stop-color="#173038"/></linearGradient>
    <linearGradient id="mtg-chair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6a72"/><stop offset="1" stop-color="#2f4850"/></linearGradient>
    <linearGradient id="mtg-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <radialGradient id="mtg-lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e0" stop-opacity=".7"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/></radialGradient>
    <filter id="mtg-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="mtg-blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Rückwand und Boden -->
  <rect width="1600" height="900" fill="url(#mtg-wall)"/>
  <rect y="600" width="1600" height="300" fill="url(#mtg-floor)"/>
  <rect y="596" width="1600" height="8" fill="#7f8b90"/>

  <!-- Decke -->
  <rect width="1600" height="70" fill="#f5f7f8"/>
  <rect y="68" width="1600" height="4" fill="#c3ccd0"/>

  <!-- Lichtschein der Leuchten -->
  <g filter="url(#mtg-blur)">
    <ellipse cx="400" cy="120" rx="150" ry="70" fill="url(#mtg-lamp)"/><ellipse cx="800" cy="120" rx="150" ry="70" fill="url(#mtg-lamp)"/><ellipse cx="1200" cy="120" rx="150" ry="70" fill="url(#mtg-lamp)"/>
  </g>

  <!-- Glaswand mit Stadtblick (links) -->
  <rect x="40" y="110" width="640" height="470" fill="url(#mtg-sky)"/>
  <!-- Stadt: ferne Ebene -->
  <g fill="#b3c6cd">
    <rect x="40" y="400" width="60" height="180"/><rect x="110" y="360" width="50" height="220"/><rect x="170" y="420" width="80" height="160"/>
    <rect x="260" y="340" width="55" height="240"/><rect x="325" y="390" width="70" height="190"/><rect x="405" y="330" width="50" height="250"/>
    <rect x="465" y="410" width="80" height="170"/><rect x="555" y="370" width="60" height="210"/><rect x="625" y="400" width="55" height="180"/>
  </g>
  <!-- Stadt: nahe Ebene -->
  <g fill="#8fa8b2">
    <rect x="40" y="470" width="90" height="110"/><rect x="140" y="440" width="70" height="140"/><rect x="220" y="490" width="100" height="90"/>
    <rect x="330" y="430" width="80" height="150"/><rect x="420" y="480" width="90" height="100"/><rect x="520" y="450" width="70" height="130"/><rect x="600" y="490" width="80" height="90"/>
  </g>
  <!-- Fensterspiegelung -->
  <rect x="40" y="110" width="640" height="470" fill="url(#mtg-glass)"/>
  <polygon points="140,110 260,110 120,580 40,580 40,500" fill="#fff" opacity=".12"/>
  <!-- Rahmen -->
  <g fill="#5f6f75">
    <rect x="34" y="104" width="652" height="10"/><rect x="34" y="576" width="652" height="10"/>
    <rect x="34" y="104" width="10" height="482"/><rect x="676" y="104" width="10" height="482"/>
    <rect x="252" y="104" width="8" height="482"/><rect x="466" y="104" width="8" height="482"/>
  </g>

  <!-- Wandbildschirm rechts -->
  <rect x="930" y="150" width="560" height="320" rx="10" fill="#2a3338"/>
  <rect x="946" y="166" width="528" height="288" rx="4" fill="url(#mtg-screen)"/>
  <!-- Schematische Diagramme (ohne Text) -->
  <g opacity=".75">
    <rect x="980" y="200" width="150" height="14" rx="3" fill="#7fc3c8"/>
    <rect x="980" y="230" width="230" height="8" rx="3" fill="#9fb3b8" opacity=".6"/>
    <rect x="980" y="250" width="190" height="8" rx="3" fill="#9fb3b8" opacity=".6"/>
    <g fill="#3f9aa3"><rect x="1010" y="360" width="34" height="60"/><rect x="1056" y="335" width="34" height="85"/><rect x="1102" y="310" width="34" height="110"/><rect x="1148" y="290" width="34" height="130"/></g>
    <circle cx="1350" cy="340" r="62" fill="none" stroke="#3f9aa3" stroke-width="22"/>
    <path d="M1350 278A62 62 0 0 1 1412 340" fill="none" stroke="#b9dcdf" stroke-width="22"/>
  </g>
  <rect x="946" y="166" width="528" height="288" rx="4" fill="url(#mtg-glass)"/>

  <!-- Whiteboard Mitte-links -->
  <rect x="700" y="230" width="190" height="150" rx="4" fill="#f7f9f9" stroke="#aab4b8" stroke-width="6"/>
  <g fill="none" stroke="#3f9aa3" stroke-width="3" opacity=".5"><path d="M725 270H800M725 300H860M725 330H830"/></g>

  <!-- Boden-Reflexion Tisch -->
  <ellipse cx="800" cy="800" rx="640" ry="60" fill="#6d7a80" opacity=".25" filter="url(#mtg-blur)"/>

  <!-- Stühle hinten (hinter dem Tisch) -->
  <g fill="url(#mtg-chair)">
    <rect x="330" y="560" width="90" height="90" rx="22"/><rect x="480" y="560" width="90" height="90" rx="22"/>
    <rect x="630" y="560" width="90" height="90" rx="22"/><rect x="780" y="560" width="90" height="90" rx="22"/>
    <rect x="930" y="560" width="90" height="90" rx="22"/><rect x="1080" y="560" width="90" height="90" rx="22"/>
    <rect x="1230" y="560" width="90" height="90" rx="22"/>
  </g>
  <g fill="#22363c">
    <rect x="368" y="650" width="14" height="40"/><rect x="518" y="650" width="14" height="40"/><rect x="668" y="650" width="14" height="40"/>
    <rect x="818" y="650" width="14" height="40"/><rect x="968" y="650" width="14" height="40"/><rect x="1118" y="650" width="14" height="40"/><rect x="1268" y="650" width="14" height="40"/>
  </g>

  <!-- Konferenztisch -->
  <polygon points="150,730 1450,730 1330,640 270,640" fill="url(#mtg-table)"/>
  <polygon points="150,730 1450,730 1450,752 150,752" fill="url(#mtg-tableside)"/>
  <polygon points="270,640 1330,640 1320,646 280,646" fill="#fff" opacity=".6"/>
  <!-- Tischbeine -->
  <rect x="230" y="752" width="26" height="100" fill="#6d7a80"/><rect x="1344" y="752" width="26" height="100" fill="#6d7a80"/>
  <!-- Tischgegenstände (schlicht) -->
  <rect x="700" y="672" width="80" height="26" rx="3" fill="#2f4850" opacity=".85"/>
  <rect x="940" y="676" width="60" height="22" rx="3" fill="#e3e8ea"/>
  <ellipse cx="560" cy="690" rx="16" ry="5" fill="#3f9aa3" opacity=".7"/>

  <!-- Stühle vorne (angeschnitten, unten) -->
  <g fill="#2f4850">
    <rect x="200" y="800" width="130" height="120" rx="30"/><rect x="620" y="810" width="130" height="120" rx="30"/>
    <rect x="1060" y="810" width="130" height="120" rx="30"/><rect x="1330" y="800" width="130" height="120" rx="30"/>
  </g>

  <!-- Deckenleuchten -->
  <g fill="#fffdf2" stroke="#c3ccd0" stroke-width="3">
    <rect x="320" y="58" width="160" height="22" rx="6"/><rect x="720" y="58" width="160" height="22" rx="6"/><rect x="1120" y="58" width="160" height="22" rx="6"/>
  </g>

  <!-- Pflanze im Eck rechts -->
  <rect x="1500" y="520" width="50" height="80" rx="6" fill="#f0f2f3"/>
  <g fill="#4f8a7c"><ellipse cx="1510" cy="470" rx="14" ry="50" transform="rotate(-20 1510 470)"/><ellipse cx="1540" cy="460" rx="14" ry="55" transform="rotate(15 1540 460)"/><ellipse cx="1525" cy="450" rx="12" ry="55"/></g>
</svg>
